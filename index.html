<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Sonrisa Integrado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-card { background: #1e293b; border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h2 { font-size: 1.25rem; margin-bottom: 8px; color: #38bdf8; }
        p.subtitle { font-size: 0.88rem; color: #94a3b8; margin-bottom: 16px; min-height: 38px; }
        
        .camera-container { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Guías visuales */
        .overlay-guide { position: absolute; border: 3px dashed #38bdf8; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45); }
        .guide-face { width: 65%; height: 60%; border-radius: 50%; top: 15%; }
        .guide-smile { width: 50%; height: 22%; border-radius: 35px; top: 40%; border-color: #4ade80; }
        .guide-teeth { width: 38%; height: 14%; border-radius: 16px; top: 43%; border-color: #facc15; }

        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-secondary { background: #334155; color: #f8fafc; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .preview-item { background: #0f172a; border-radius: 8px; padding: 5px; font-size: 0.75rem; text-align: center; color: #94a3b8; }
        .preview-item img { width: 100%; height: 75px; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 4px; background: #1e293b; }

        /* Visor de Simulación */
        #simulationView { display: none; margin-top: 15px; }
        .sim-container { position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; }
        .sim-container img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .sim-overlay { filter: brightness(1.25) contrast(1.15) saturate(0.85); clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); }
        .slider-box { margin-top: 15px; }
        input[type="range"] { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-card">
    <div id="captureStage">
        <h2 id="stepTitle">Paso 1: Rostro en Reposo</h2>
        <p class="subtitle" id="stepInstruction">Centra tu rostro completo dentro del óvalo sin sonreír.</p>

        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="guideOverlay" class="overlay-guide guide-face"></div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="startCamera()">Activar Cámara</button>
            <button class="btn-primary" onclick="captureStep()">Tomar Foto</button>
        </div>

        <div class="preview-grid">
            <div class="preview-item">
                <img id="thumb-1" src="https://via.placeholder.com/150?text=Rostro" alt="Rostro">
                Rostro
            </div>
            <div class="preview-item">
                <img id="thumb-2" src="https://via.placeholder.com/150?text=Sonrisa" alt="Sonrisa">
                Sonrisa
            </div>
            <div class="preview-item">
                <img id="thumb-3" src="https://via.placeholder.com/150?text=Dientes" alt="Dientes">
                Dientes
            </div>
        </div>
    </div>

    <!-- Resultados y Simulación -->
    <div id="simulationView">
        <h2>Resultado de la Simulación</h2>
        <p class="subtitle">Desliza la barra para comparar la sonrisa original vs. mejorada</p>
        
        <div class="sim-container">
            <img id="imgOriginal" src="" alt="Original">
            <img id="imgSimulated" class="sim-overlay" src="" alt="Simulación">
        </div>

        <div class="slider-box">
            <input type="range" id="simSlider" min="0" max="100" value="50" oninput="updateSlider(this.value)">
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="resetCapture()">Repetir Captura</button>
        </div>
    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
    let currentStep = 1;
    const steps = [
        { title: "Paso 1: Rostro en Reposo", instruction: "Centra tu rostro completo dentro del óvalo sin sonreír.", guideClass: "guide-face", crop: { xPct: 0, yPct: 0, wPct: 1, hPct: 1 } },
        { title: "Paso 2: Sonrisa Completa", instruction: "Sonríe naturalmente y ubica tu boca dentro del recuadro verde.", guideClass: "guide-smile", crop: { xPct: 0.25, yPct: 0.40, wPct: 0.50, hPct: 0.22 } },
        { title: "Paso 3: Acercamiento a Dientes", instruction: "Encuadra la zona de los dientes dentro del recuadro amarillo.", guideClass: "guide-teeth", crop: { xPct: 0.31, yPct: 0.43, wPct: 0.38, hPct: 0.14 } }
    ];

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('captureCanvas');
    const guideOverlay = document.getElementById('guideOverlay');
    const captures = {};

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
        } catch (err) {
            alert("No se pudo acceder a la cámara.");
        }
    }

    function captureStep() {
        if (!video.srcObject) return alert("Activa la cámara primero.");

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        canvas.width = vw;
        canvas.height = vh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, vw, vh);

        const imgData = canvas.toDataURL('image/png');
        captures[currentStep] = imgData;
        document.getElementById(`thumb-${currentStep}`).src = imgData;

        if (currentStep < 3) {
            currentStep++;
            updateStepUI();
        } else {
            showSimulation();
        }
    }

    function updateStepUI() {
        const step = steps[currentStep - 1];
        document.getElementById('stepTitle').innerText = step.title;
        document.getElementById('stepInstruction').innerText = step.instruction;
        guideOverlay.className = `overlay-guide ${step.guideClass}`;
    }

    function showSimulation() {
        document.getElementById('captureStage').style.display = 'none';
        document.getElementById('simulationView').style.display = 'block';

        const baseImage = captures[2] || captures[1];
        document.getElementById('imgOriginal').src = baseImage;
        document.getElementById('imgSimulated').src = baseImage;
    }

    function updateSlider(val) {
        document.getElementById('imgSimulated').style.clipPath = `polygon(0 0, ${val}% 0, ${val}% 100%, 0 100%)`;
    }

    function resetCapture() {
        currentStep = 1;
        document.getElementById('simulationView').style.display = 'none';
        document.getElementById('captureStage').style.display = 'block';
        updateStepUI();
    }

    window.onload = startCamera;
</script>

</body>
</html>
