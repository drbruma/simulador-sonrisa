<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Ortodoncia y Alineación</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-card { background: #1e293b; border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h2 { font-size: 1.25rem; margin-bottom: 8px; color: #38bdf8; }
        p.subtitle { font-size: 0.88rem; color: #94a3b8; margin-bottom: 16px; min-height: 38px; }
        
        .camera-container { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .overlay-guide { position: absolute; border: 3px dashed #38bdf8; pointer-events: none; transition: all 0.3s ease; box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45); }
        .guide-face { width: 65%; height: 60%; border-radius: 50%; top: 15%; }
        .guide-smile { width: 50%; height: 22%; border-radius: 35px; top: 40%; border-color: #4ade80; }
        .guide-teeth { width: 38%; height: 14%; border-radius: 16px; top: 43%; border-color: #facc15; }

        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-secondary { background: #334155; color: #f8fafc; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .preview-item { background: #0f172a; border-radius: 8px; padding: 5px; font-size: 0.75rem; text-align: center; color: #94a3b8; }
        .preview-item img { width: 100%; height: 75px; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 4px; background: #1e293b; }

        /* Visor de Simulación y Capa de Dientes Alineados */
        #simulationView { display: none; margin-top: 15px; }
        .sim-container { position: relative; width: 100%; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: #000; }
        .sim-container img.base-photo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* Arcada Alineada Superpuesta */
        .teeth-overlay {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 48%;
            pointer-events: auto;
            cursor: move;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)) brightness(1.15) contrast(1.05);
            opacity: 0.9;
        }

        .controls-panel { margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 10px; text-align: left; font-size: 0.8rem; }
        .control-row { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .control-row label { color: #cbd5e1; }
        .control-row input[type="range"] { width: 60%; }
    </style>
</head>
<body>

<div class="app-card">
    <!-- Etapa de Captura -->
    <div id="captureStage">
        <h2 id="stepTitle">Paso 1: Rostro en Reposo</h2>
        <p class="subtitle" id="stepInstruction">Centra tu rostro completo dentro del óvalo sin sonreír.</p>

        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
            <div id="guideOverlay" class="overlay-guide guide-face"></div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="startCamera()">Activar Cámara</button>
            <button class="btn-primary" onclick="captureStep()">Tomar Foto</button>
        </div>

        <div class="preview-grid">
            <div class="preview-item">
                <img id="thumb-1" src="https://via.placeholder.com/150?text=Rostro" alt="Rostro">
                Rostro
            </div>
            <div class="preview-item">
                <img id="thumb-2" src="https://via.placeholder.com/150?text=Sonrisa" alt="Sonrisa">
                Sonrisa
            </div>
            <div class="preview-item">
                <img id="thumb-3" src="https://via.placeholder.com/150?text=Dientes" alt="Dientes">
                Dientes
            </div>
        </div>
    </div>

    <!-- Etapa de Simulación Real de Alineación -->
    <div id="simulationView">
        <h2>Simulación de Alineación y Sonrisa</h2>
        <p class="subtitle">Ajusta la arcada digital sobre la sonrisa del paciente</p>
        
        <div class="sim-container" id="simContainer">
            <img id="imgOriginal" class="base-photo" src="" alt="Foto Original">
            <!-- Vector de Arcada Alineada Digital -->
            <svg id="teethOverlay" class="teeth-overlay" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
                <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1">
                    <!-- Centrales -->
                    <path d="M128,15 C138,12 148,12 149,45 C149,60 128,62 128,15 Z" />
                    <path d="M151,12 C161,12 171,15 171,15 C171,62 150,60 150,45 Z" />
                    <!-- Laterales -->
                    <path d="M107,20 C117,17 126,16 126,46 C126,57 108,56 107,20 Z" />
                    <path d="M173,16 C182,17 192,20 192,20 C191,56 173,57 173,46 Z" />
                    <!-- Caninos -->
                    <path d="M88,28 C97,23 105,21 105,46 C105,54 89,52 88,28 Z" />
                    <path d="M194,21 C202,23 211,28 211,28 C210,52 194,54 194,46 Z" />
                    <!-- Premolares -->
                    <path d="M72,37 C80,31 86,29 86,46 C86,51 73,49 72,37 Z" />
                    <path d="M213,29 C219,31 227,37 227,37 C226,49 213,51 213,46 Z" />
                </g>
            </svg>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <label for="sliderScale">Tamaño Arcada:</label>
                <input type="range" id="sliderScale" min="0.5" max="1.8" step="0.05" value="1" oninput="updateTeethTransform()">
            </div>
            <div class="control-row">
                <label for="sliderY">Posición Vertical:</label>
                <input type="range" id="sliderY" min="20" max="80" step="1" value="45" oninput="updateTeethTransform()">
            </div>
            <div class="control-row">
                <label for="sliderOpacity">Intensidad Simulación:</label>
                <input type="range" id="sliderOpacity" min="0" max="1" step="0.05" value="0.9" oninput="updateTeethTransform()">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="resetCapture()">Repetir Captura</button>
        </div>
    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
    let currentStep = 1;
    const steps = [
        { title: "Paso 1: Rostro en Reposo", instruction: "Centra tu rostro completo dentro del óvalo sin sonreír.", guideClass: "guide-face" },
        { title: "Paso 2: Sonrisa Completa", instruction: "Sonríe naturalmente y ubica tu boca dentro del recuadro verde.", guideClass: "guide-smile" },
        { title: "Paso 3: Acercamiento a Dientes", instruction: "Encuadra la zona de los dientes dentro del recuadro amarillo.", guideClass: "guide-teeth" }
    ];

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('captureCanvas');
    const guideOverlay = document.getElementById('guideOverlay');
    const captures = {};

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
        } catch (err) {
            alert("No se pudo acceder a la cámara.");
        }
    }

    function captureStep() {
        if (!video.srcObject) return alert("Activa la cámara primero.");

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        canvas.width = vw;
        canvas.height = vh;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, vw, vh);

        const imgData = canvas.toDataURL('image/png');
        captures[currentStep] = imgData;
        document.getElementById(`thumb-${currentStep}`).src = imgData;

        if (currentStep < 3) {
            currentStep++;
            updateStepUI();
        } else {
            showSimulation();
        }
    }

    function updateStepUI() {
        const step = steps[currentStep - 1];
        document.getElementById('stepTitle').innerText = step.title;
        document.getElementById('stepInstruction').innerText = step.instruction;
        guideOverlay.className = `overlay-guide ${step.guideClass}`;
    }

    function showSimulation() {
        document.getElementById('captureStage').style.display = 'none';
        document.getElementById('simulationView').style.display = 'block';

        const baseImage = captures[2] || captures[1] || captures[3];
        document.getElementById('imgOriginal').src = baseImage;
        updateTeethTransform();
    }

    function updateTeethTransform() {
        const scale = document.getElementById('sliderScale').value;
        const posY = document.getElementById('sliderY').value;
        const opacity = document.getElementById('sliderOpacity').value;

        const overlay = document.getElementById('teethOverlay');
        overlay.style.top = `${posY}%`;
        overlay.style.transform = `translate(-50%, -50%) scale(${scale})`;
        overlay.style.opacity = opacity;
    }

    function resetCapture() {
        currentStep = 1;
        document.getElementById('simulationView').style.display = 'none';
        document.getElementById('captureStage').style.display = 'block';
        updateStepUI();
    }

    window.onload = startCamera;
</script>

</body>
</html>
